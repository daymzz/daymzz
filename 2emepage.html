        .logo {

        }
    </style>
</head>

    <main>
        <section>
            <h2>Contenu 1</h2>
        <p>Ceci est le contenu de votre deuxième page.</p>
        <img src="logo.jpg" alt="Logo du site" class="logo">
        </section>
       
    </main>
